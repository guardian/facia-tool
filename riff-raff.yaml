regions: [eu-west-1]
stacks: [cms-fronts]
allowedStages:
  - CODE
  - PROD

deployments:
  cfn-facia-tool:
    type: cloud-formation
    app: facia-tool
    parameters:
      templateStagePaths:
        CODE: FaciaTool-euwest-1-CODE.template.json
        PROD: FaciaTool-euwest-1-PROD.template.json
      cloudFormationStackName: facia
      prependStackToCloudFormationStackName: false
      amiParametersToTags:
        AMI:
          Recipe: editorial-tools-jammy-java11
          AmigoStage: PROD
          BuiltBy: amigo
        AMIFaciatool:
          Recipe: editorial-tools-jammy-java11
          AmigoStage: PROD
          BuiltBy: amigo
      amiEncrypted: true
  facia-tool:
    type: autoscaling
    parameters:
      # Dual-stack migration: rotate both the legacy ASG and the new (GuEc2App) one.
      asgMigrationInProgress: true
    dependencies:
        - cfn-facia-tool
