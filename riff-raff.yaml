regions: [eu-west-1]
stacks: [cms-fronts]
allowedStages:
  - CODE
  - PROD

deployments:
  cfn-facia-tool:
    type: cloud-formation
    app: facia-tool
    parameters:
      templateStagePaths:
        CODE: FaciaTool-euwest-1-CODE.template.json
        PROD: FaciaTool-euwest-1-PROD.template.json
      cloudFormationStackName: facia
      prependStackToCloudFormationStackName: false
      amiParametersToTags:
        AMIFaciatool:
          Recipe: editorial-tools-jammy-java11
          AmigoStage: PROD
          BuiltBy: amigo
      amiEncrypted: true
  # The database and the editions fan-out, ported from facia-editions.yml in
  # editorial-tools-platform. Nothing else in this project depends on it, and it depends on
  # nothing, so it is deployed alongside the service rather than before or after it.
  cfn-facia-editions:
    type: cloud-formation
    app: facia-tool
    parameters:
      templateStagePaths:
        CODE: FaciaEditions-euwest-1-CODE.template.json
        PROD: FaciaEditions-euwest-1-PROD.template.json
      cloudFormationStackName: facia-db
      prependStackToCloudFormationStackName: false
  facia-tool:
    type: autoscaling
    dependencies:
        - cfn-facia-tool
