regions: [eu-west-1]
stacks: [cms-fronts]
allowedStages:
  - CODE
  - PROD

deployments:
  # The database and the editions fan-out, ported from facia-editions.yml in
  # editorial-tools-platform.
  cfn-facia-editions:
    type: cloud-formation
    app: facia-tool
    parameters:
      templateStagePaths:
        CODE: FaciaEditions-euwest-1-CODE.template.json
        PROD: FaciaEditions-euwest-1-PROD.template.json
      cloudFormationStackName: facia-db
      prependStackToCloudFormationStackName: false
  cfn-facia-tool:
    type: cloud-formation
    app: facia-tool
    # The service stack is to take the database's security group from this one rather than
    # from the untracked DBSecurityGroupIdNewVPC parameter, so order them now.
    dependencies:
        - cfn-facia-editions
    parameters:
      templateStagePaths:
        CODE: FaciaTool-euwest-1-CODE.template.json
        PROD: FaciaTool-euwest-1-PROD.template.json
      cloudFormationStackName: facia
      prependStackToCloudFormationStackName: false
      amiParametersToTags:
        AMIFaciatool:
          Recipe: editorial-tools-jammy-java11
          AmigoStage: PROD
          BuiltBy: amigo
      amiEncrypted: true
  facia-tool:
    type: autoscaling
    dependencies:
        - cfn-facia-tool
