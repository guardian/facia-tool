name: End-to-end tests

on:
  push:
    branches:
      - main
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  playwright-tests:
    name: Playwright end-to-end tests
    runs-on: ubuntu-22.04
    timeout-minutes: 30
    defaults:
      run:
        working-directory: e2e-tests

    steps:
      - name: Check out facia-tool
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5

      - name: Set up Node and Yarn cache
        uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5
        with:
          node-version-file: e2e-tests/.tool-versions
          cache: yarn
          cache-dependency-path: e2e-tests/yarn.lock

      - name: Install end-to-end dependencies
        run: yarn install --frozen-lockfile

      - name: Install Playwright Chromium headless shell
        run: yarn playwright install --with-deps chromium --only-shell

      - name: Run end-to-end tests
        run: yarn test:ci

      - name: Upload Playwright failure artifacts
        if: failure()
        uses: actions/upload-artifact@330a01c490aca151604b8cf639adc76d48f6c5d4 # v5
        with:
          name: playwright-failure-artifacts
          path: e2e-tests/target/test-results
          if-no-files-found: warn
          retention-days: 7