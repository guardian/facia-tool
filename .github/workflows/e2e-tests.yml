name: End-to-end tests

on:
  push:
    branches:
      - main
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  playwright-tests:
    name: Playwright end-to-end tests
    runs-on: ubuntu-22.04
    timeout-minutes: 30
    defaults:
      run:
        working-directory: e2e-tests

    steps:
      - name: Check out facia-tool
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Set up Node and Yarn cache
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version-file: e2e-tests/.tool-versions
          cache: yarn
          cache-dependency-path: e2e-tests/yarn.lock

      - name: Install end-to-end dependencies
        run: yarn install --frozen-lockfile

      - name: Install Playwright Chromium headless shell
        run: yarn playwright install --with-deps chromium --only-shell

      - name: Run end-to-end tests
        run: yarn test:ci

      - name: Upload Playwright failure artifacts
        if: failure()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: playwright-failure-artifacts
          path: e2e-tests/target/test-results
          if-no-files-found: warn
          retention-days: 7